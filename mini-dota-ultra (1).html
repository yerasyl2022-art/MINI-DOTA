function mk(team,type,x,y,o){const u=Object.assign({id:uid++,team,type,x,y,px:x,py:y,vx:0,vy:0,fa:team==1?3.9:.8,hp:100,dmg:0,rng:0,spd:0,cd:0,acd:40,r:8,slow:0,buff:0,stun:0,rf:0,arm:0,path:null,pi:0,ranged:0,tx:x,ty:y,tgt:null,dead:0,dash:null,lane:0,bkb:0},o);u.max=u.hp;us.push(u);return u}
function mkHero(team,ci,x,y,ai,lane){const h=HR[ci];const u=mk(team,'hero',x,y,{hp:h[2],dmg:h[3],rng:h[4],spd:h[5],acd:34,r:15,ranged:h[4]>100?1:0,h,mp:h[6],mmax:h[6],cds:[0,0,0,0],sk:[0,0,0,0],lvl:1,xp:0,gold:800,ai,home:{x,y},resp:0,lane,inv:[],k:0,dth:0,lh:0,aegis:0,as:0,ls:0,cdr:0,reg:0});recalc(u);return u}
function recalc(u){const S={d:0,a:0,h:0,m:0,s:0,as:0,ls:0,c:0,r:0};u.inv.forEach(s=>{const t=ITM[s.id][2];for(const kk in t)S[kk]+=t[kk]});
 const mh=u.h[2]+75*(u.lvl-1)+S.h,mm=u.h[6]+30*(u.lvl-1)+S.m;u.hp+=mh-u.max;u.mp+=mm-u.mmax;u.max=mh;u.mmax=mm;
 u.dmg=u.h[3]+4*(u.lvl-1)+S.d;u.arm=S.a+u.lvl;u.spd=u.h[5]+S.s;u.as=S.as;u.ls=S.ls;u.cdr=S.c;u.reg=S.r;u.rad=u.inv.some(s=>ITM[s.id][3]=='radiance')}
const worth=u=>u.gold+u.inv.reduce((a,s)=>a+ITM[s.id][1],0);
function buy(u,id){const c=ITM[id][1];if(u.gold<c||u.inv.length>=6||u.dead)return false;u.gold-=c;u.inv.push({id,cd:0});recalc(u);ring(u.x,u.y,30,'#fc0',15);return true}
function sell(u,i){const s=u.inv[i];if(!s)return;u.gold+=Math.floor(ITM[s.id][1]*.5);u.inv.splice(i,1);recalc(u)}
function pathOf(l,t){const p=LANES[l].slice();return t?p.reverse():p}
function onPath(p,s){for(let i=1;i<p.length;i++){const L=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(s<=L||i==p.length-1){const f=Math.min(1,s/L);return[p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f]}s-=L}}
function plen(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s}
function dseg(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=cl(((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t)}
function genTrees(){const cp=[];CAMPDEF.forEach(c=>{cp.push([c[0],c[1]],[MW-c[0],MW-c[1]])});cp.push([2000,2000]);
 for(let gx=40;gx<MW;gx+=64)for(let gy=40;gy<MW;gy+=64){const h=Math.abs(Math.sin(gx*12.9898+gy*78.233)*43758.5453)%1;if(h>.55)continue;
  const x=gx+(h*97%1)*50,y=gy+(h*53%1)*50;let ok=1;
  for(const l of LANES)for(let i=1;i<l.length;i++)if(dseg(x,y,l[i-1],l[i])<150)ok=0;
  if(!ok||Math.hypot(x-400,y-4400)<480||Math.hypot(x-4400,y-400)<480||Math.abs(x-y)/1.414<100)continue;
  if(cp.some(c=>Math.hypot(x-c[0],y-c[1])<(c[0]==2000&&c[1]==2000?230:170)))continue;
  TREES.push({x,y,s:13+h*16,v:Math.floor(h*10)%3})}
 TREES.sort((a,b)=>a.y-b.y)}

function init(ci){us=[];fx=[];bolts=[];q=[];drops=[];tick=0;kills=[0,0];uid=0;shop=false;ROS.deaths=0;ROS.next=0;

function near(u,rg){let b=null,bd=1e9;for(const e of us){if(e.dead||e.team==u.team)continue;const dd=d(u,e)-e.r;if(dd>rg)continue;const sc=dd+(e.type=='hero'&&u.type!='hero'?60:0)+(e.type=='base'?200:0);if(sc<bd){bd=sc;b=e}}return b}
function mv(u,x,y){const dd=Math.hypot(x-u.x,y-u.y);let s=u.spd*(u.slow>0?.5:1)*(u.buff>0&&u.type=='hero'?1.4:1);if(dd>1)u.fa=Math.atan2(y-u.y,x-u.x);if(dd>s){u.x=cl(u.x+(x-u.x)/dd*s,10,MW-10);u.y=cl(u.y+(y-u.y)/dd*s,10,MW-10)}}
function shield(b){for(let l=0;l<3;l++)if(!us.some(t=>t.type=='tower'&&t.team==b.team&&t.lane==l&&!t.dead))return 0;return 1}
const stunU=(e,t)=>{if(e.bkb>0||e.type=='base')return;e.stun=Math.max(e.stun,t)},slowU=(e,t)=>{if(e.bkb>0)return;e.slow=Math.max(e.slow,t)};
function dmgTo(a,b,n){if(b.dead)return;if(b.type=='base'&&shield(b)){ring(b.x,b.y,60,'#fff',8);return}
 if(b.bkb>0)n*=.6;n=n*100/(100+(b.arm||0)*3);
 if(b.team==2&&a&&a.team!=2&&b.camp)b.camp.units.forEach(x=>{if(!x.dead&&!x.tgt)x.tgt=a});
 b.hp-=n;if(b.hp<=0)kill(b,a)}
function hit(a,b){a.cd=a.acd/(1+(a.as||0)/100)*(a.rf>0?.5:1);a.fa=Math.atan2(b.y-a.y,b.x-a.x);dmgTo(a,b,a.dmg);if(a.ls)a.hp=Math.min(a.max,a.hp+a.dmg*a.ls/100);
 if(a.ranged||a.type=='tower')fx.push({k:'line',x:a.x,y:a.y,x2:b.x,y2:b.y,t:6,t0:6,c:a.type=='tower'?'#ff6':a.type=='hero'?a.h[1]:'#fff'})}
function kill(b,a){
 if(b.type=='hero'&&b.aegis>0){b.dead=0;b.hp=b.max;b.mp=b.mmax;b.aegis=0;b.stun=b.slow=0;ring(b.x,b.y,110,'#fd4',40);ban(b.h[0]+' возродился с Эгидой!');return}
 b.dead=1;ring(b.x,b.y,b.r+14,'#fff');
 const n2=us.filter(h=>h.type=='hero'&&!h.dead&&h.team!=b.team&&d(h,b)<900),ah=a&&a.type=='hero'?a:null;
 if(b.type=='creep'||b.type=='neu'){
  const gold=b.type=='neu'?b.bounty:46+Math.floor(tick/1800)*4,xp=Math.ceil((b.type=='neu'?b.rosh?400:130:90)/Math.max(1,n2.length));
  n2.forEach(h=>giveXp(h,xp));
  if(ah){ah.gold+=gold;ah.lh++;fx.push({k:'txt',x:b.x,y:b.y-20,s:'+'+gold,t:40,t0:40})}
  if(b.rosh){ROS.deaths++;ROS.next=tick+14400;if(ah){us.forEach(h=>{if(h.type=='hero'&&h.team==ah.team)h.gold+=500});ah.aegis=18000;ban('Рошан убит! '+ah.h[0]+' получает Эгиду Бессмертного')}}}
 if(b.type=='hero'){b.dth++;b.resp=300+b.lvl*90;kills[b.team?0:1]++;if(ah)ah.k++;n2.forEach(h=>{giveXp(h,150+b.lvl*60);h.gold+=h===ah?400+b.lvl*60:180})}
 if(b.type=='tower'){us.forEach(h=>{if(h.type=='hero'&&h.team!=b.team)h.gold+=h===ah?450:200});n2.forEach(h=>giveXp(h,200))}
 if(b.type=='base'){state='over';msg=b.team?'ПОБЕДА! GG':'ПОРАЖЕНИЕ :(';saveRes(b.team==1)}}
function giveXp(h,x){h.xp+=x;while(h.lvl<18&&h.xp>=h.lvl*220){h.xp-=h.lvl*220;h.lvl++;recalc(h);ring(h.x,h.y,60,'#ff0',30)}}

  if(ROS.units[0]&&ROS.units[0].dead&&tick>=ROS.next){spawnRosh();ban('Рошан возродился!')}

  rows.forEach((u,i)=>{const yy=y+40+i*20;if(u===hero){g.fillStyle='#fc42';g.fillRect(x+4,yy-13,242,18)}g.fillStyle=u.team?'#e44':'#48f';g.fillRect(x+10,yy-9,8,8);
   txt((i+1)+'. '+u.h[0].slice(0,9)+' '+u.lvl,x+24,yy,12,u.dead?'#888':'#fff');txt(u.k+'/'+u.dth,x+158,yy,12,'#cfc','right');txt(''+worth(u),x+240,yy,12,'#fc4','right')})}
 if(h.dead)txt('Ты погиб. Возрождение: '+Math.ceil(h.resp/60)+' с',640,340,32,'#f66','center');
 if(paused)txt('ПАУЗА',640,340,60,'#fff','center');
 if(shop){g.fillStyle='#000a';g.fillRect(0,0,1280,680);g.fillStyle='#161a2cf5';rr(30,60,1220,545,14);g.fill();g.strokeStyle='#fc4';g.lineWidth=2;g.stroke();
  txt('🛒 МАГАЗИН DOTA 2',50,100,24,'#fc4','left','bold');txt('Золото: '+Math.floor(h.gold)+'   Слоты: '+h.inv.length+'/6   (клик по предмету = купить, ПКМ по слоту в панели = продать)',320,98,15,'#ddd');
  ITM.forEach((it,i)=>{const x=50+(i%8)*148,y=130+Math.floor(i/8)*72,ok=h.gold>=it[1]&&h.inv.length<6;g.fillStyle=ok?'#26304f':'#1a1e30';rr(x,y,142,66,8);g.fill();g.strokeStyle=ok?'#fc4':'#333';g.lineWidth=1;g.stroke();
   txt(it[0].slice(0,19),x+7,y+16,12,'#fff','left','bold');txt(it[1]+' g',x+7,y+31,12,ok?'#fc4':'#777');const ds=desc(it);txt(ds.slice(0,26),x+7,y+46,10,'#9ab');txt(ds.slice(26,52),x+7,y+58,10,'#9ab')})}
 if(state=='over'){g.fillStyle='#000b';g.fillRect(0,0,1280,800);txt(msg,640,380,70,'#fc4','center','bold');txt('Клик, чтобы вернуться в меню',640,440,22,'#ccc','center')}

// ---------- INPUT ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*800/r.height}}
const wp=()=>({x:mouse.x+cam.x,y:mouse.y+cam.y});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{const p=pos(e);ptr=p;if(p.y<680)mouse=p});
cv.addEventListener('pointerdown',e=>{const p=pos(e);ptr=p;
 if(state=='menu'){HR.forEach((h,i)=>{const c=cardPos(i);if(p.x>c.x&&p.x<c.x+c.w&&p.y>c.y&&p.y<c.y+c.h)init(i)});return}
 if(state=='over'){state='menu';SV=getSave();return}
 if(p.x>10&&p.x<140&&p.y>8&&p.y<38){shop=!shop;return}
 if(shop){if(p.x<30||p.x>1250||p.y<60||p.y>605){shop=false;return}
  const ix=Math.floor((p.x-50)/148),iy=Math.floor((p.y-130)/72);if(p.x>=50&&p.y>=130&&ix<8&&(p.x-50)%148<142&&(p.y-130)%72<66){const id=iy*8+ix;if(id<ITM.length)buy(hero,id)}return}
 if(p.y>=680){const w=wp();for(let i=0;i<4;i++){const x=350+i*95;if(p.x>x&&p.x<x+85){if(p.x>x+58&&p.y<716&&canLearn(hero,i))learn(hero,i);else cast(hero,i,w.x,w.y)}}
  for(let i=0;i<6;i++){const x=750+i*68;if(p.x>x&&p.x<x+62){if(e.button==2)sell(hero,i);else useItem(hero,i,w.x,w.y)}}return}
 mouse=p;const w=wp(),t=us.find(u=>!u.dead&&u.team!=0&&d(u,w)<u.r+10);
 if(t){hero.tgt=t;ring(t.x,t.y,t.r+8,'#f44',12)}else{hero.tgt=null;hero.tx=w.x;hero.ty=w.y;ring(w.x,w.y,12,'#4f4',12)}});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(state=='menu'){if('1234567890'.includes(k)&&k.length==1)init(k=='0'?9:+k-1);return}
 if(state!='play')return;
 if(k=='tab'){e.preventDefault();showLB=!showLB;return}
 if(k=='b'){shop=!shop;return}if(k=='escape'){shop=false;return}
 const i=KEYS.toLowerCase().indexOf(k);
 if(i>=0){if(e.shiftKey)learn(hero,i);else{const w=wp();cast(hero,i,w.x,w.y)}}
 if('123456'.includes(k)&&k.length==1){const w=wp();if(e.shiftKey)sell(hero,+k-1);else useItem(hero,+k-1,w.x,w.y)}
 if(k=='p')paused=!paused;
 if(k=='s'){hero.tgt=null;hero.tx=hero.x;hero.ty=hero.y}});
function fit(){cv.style.width=Math.min(innerWidth,innerHeight*1.6)+'px'}addEventListener('resize',fit);fit();
genTrees();
let last=performance.now(),acc=0;
function frame(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
